# Example workflow for consumers of this action.
# Copy this file to .github/workflows/review.yml in the repo you want reviewed.
name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: jstromwick/claude-code-review@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          exclude: '**/*.lock,dist/**,**/*.min.js'
